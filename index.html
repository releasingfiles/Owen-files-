<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OWEN FILES | ENCRYPTED</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --white: #ffffff;
            --gray: #555;
            --red: #ff3b3b;
            --green: #34c759;
            --font: "Courier New", Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--white); font-family: var(--font); overflow: hidden; }

        /* CONSTANT BACKGROUND ANIMATION (GLITCH SCANLINES) */
        #bg-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none; z-index: 100;
        }

        @keyframes noise {
            0% { transform: translateY(0); }
            100% { transform: translateY(5px); }
        }
        #bg-overlay::after {
            content: ""; position: absolute; inset: 0;
            background: rgba(255,255,255,0.03);
            animation: noise 0.2s infinite;
        }

        .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .active { display: flex; }

        /* TYPEWRITER TEXT */
        .typewriter { display: inline-block; text-align: left; max-width: 500px; font-size: 18px; line-height: 1.6; }

        /* REDACTED BOXES */
        .redact { background: #222; color: #222; padding: 0 5px; cursor: pointer; transition: 0.2s; }
        .redact.revealed { background: transparent; color: var(--red); font-weight: bold; animation: textGlitch 0.3s infinite; }

        @keyframes textGlitch {
            0% { transform: skew(2deg); opacity: 1; }
            50% { transform: skew(-2deg); opacity: 0.8; }
            100% { transform: skew(0deg); opacity: 1; }
        }

        /* DIRECTORY LOCKING */
        .dir-row { width: 100%; max-width: 400px; padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; color: var(--gray); }
        .unlocked { color: var(--white); cursor: pointer; border-left: 3px solid var(--red); background: rgba(255,0,0,0.05); }

        /* BUTTONS */
        .btn { margin-top: 30px; background: none; border: 1px solid var(--red); color: var(--red); padding: 10px 20px; cursor: pointer; display: none; text-transform: uppercase; letter-spacing: 2px; }
        .btn:hover { background: var(--red); color: white; }

        /* JYNXZI LOCK SCREEN */
        .lock-icon { font-size: 50px; color: var(--red); margin-bottom: 20px; border: 1px solid #333; border-radius: 50%; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
        .timer { font-size: 24px; color: var(--gray); margin-top: 50px; }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>

    <section id="scr-call" class="screen active">
        <h1 style="font-size: 40px;">Unknown</h1>
        <p style="color: var(--gray);">Incoming Cryptic Link...</p>
        <div onclick="startSequence()" style="margin-top:50px; width:80px; height:80px; background:var(--green); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:30px;">📞</div>
    </section>

    <section id="scr-dir" class="screen">
        <h2 style="letter-spacing: 10px;">FILES</h2>
        <div id="file-list" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </section>

    <section id="scr-view" class="screen">
        <div id="text-container" class="typewriter"></div>
        <button id="next-btn" class="btn" onclick="goBack()">[ BACK TO FILES ]</button>
        <button id="final-btn" class="btn" onclick="triggerLockdown()">[ TRANSMIT DATA ]</button>
    </section>

    <section id="scr-lock" class="screen">
        <div class="lock-icon">🔒</div>
        <h2 style="letter-spacing: 3px;">OWEN HAS SAID AND SHOWN ALL HE NEEDS TO.</h2>
        <p style="color:var(--red); font-weight:bold;">THANKS FOR LISTENING</p>
        <div id="countdown" class="timer">TERMINAL_WIPE: --:--:--</div>
    </section>

    <audio id="ring" loop src="ring.mp3"></audio>

    <script>
        let currentLevel = 1;
        const totalFiles = 7;
        const STORY = {
            1: "Everyone loved him. Friendly. Always floating around cracking jokes. Then one day... <span class='redact' onclick='reveal(this)'>Owen</span> stopped showing up.",
            2: "Zac was the last one to see him. They were at the bridge. Zac says he left early, but the cameras show him being followed by <span class='redact' onclick='reveal(this)'>Owen</span>.",
            3: "The car was found in a ravine. No blood. No struggle. Just a single glove belonging to <span class='redact' onclick='this.classList.add(\"revealed\"); checkNext(3)'>Owen</span>.",
            4: "We checked the basement. The walls were covered in photos. Every single photo was of Zac. Taken by <span class='redact' onclick='reveal(this)'>Owen</span>.",
            5: "The interrogation was a joke. He just sat there smiling. He knew we couldn't find the body. He knew he won. That monster is <span class='redact' onclick='reveal(this)'>Owen</span>.",
            6: "A year later, a letter arrived. No return address. Just a coordinate and a name: <span class='redact' onclick='reveal(this)'>Owen</span>.",
            7: "The coordinates lead to you. He's not gone. He's watching you right now. Signed, <span class='redact' onclick='reveal(this)'>Owen</span>."
        };

        function setScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startSequence() {
            document.getElementById('ring').pause();
            renderDirectory();
            setScreen('scr-dir');
        }

        function renderDirectory() {
            const list = document.getElementById('file-list');
            list.innerHTML = "";
            for (let i = 1; i <= totalFiles; i++) {
                const isUnlocked = i <= currentLevel;
                const div = document.createElement('div');
                div.className = `dir-row ${isUnlocked ? 'unlocked' : ''}`;
                div.innerHTML = `<span>FILE_00${i}</span> <span>${isUnlocked ? '[OPEN]' : '[LOCKED]'}</span>`;
                if (isUnlocked) div.onclick = () => openFile(i);
                list.appendChild(div);
            }
        }

        function openFile(n) {
            setScreen('scr-view');
            const container = document.getElementById('text-container');
            const btn = document.getElementById('next-btn');
            const fBtn = document.getElementById('final-btn');
            container.innerHTML = "";
            btn.style.display = "none";
            fBtn.style.display = "none";

            // Typewriter effect
            let i = 0;
            let fullText = STORY[n];
            container.innerHTML = fullText; // We inject HTML so the span works
            container.style.opacity = 0; 
            
            // Fade in animation for text
            let op = 0;
            let timer = setInterval(() => {
                if (op >= 1) clearInterval(timer);
                container.style.opacity = op;
                op += 0.1;
            }, 50);
        }

        function reveal(el) {
            el.classList.add('revealed');
            el.innerText = "Owen";
            if (currentLevel < totalFiles) {
                document.getElementById('next-btn').style.display = "block";
                if (currentLevel < totalFiles) currentLevel++;
            } else {
                document.getElementById('final-btn').style.display = "block";
            }
        }

        function goBack() {
            renderDirectory();
            setScreen('scr-dir');
        }

        function triggerLockdown() {
            localStorage.setItem('owen_locked', 'true');
            localStorage.setItem('owen_expiry', new Date().getTime() + 14400000);
            startLockdown();
        }

        function startLockdown() {
            setScreen('scr-lock');
            setInterval(() => {
                const now = new Date().getTime();
                const expiry = localStorage.getItem('owen_expiry');
                const diff = expiry - now;
                if (diff <= 0) {
                    document.getElementById('countdown').innerText = "SYSTEM PURGED";
                    return;
                }
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('countdown').innerText = `TERMINAL_WIPE: ${h}:${m}:${s}`;
            }, 1000);
        }

        // Keep locked on refresh
        if (localStorage.getItem('owen_locked') === 'true') {
            window.onload = startLockdown;
        }
    </script>
</body>
</html>
